name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: install shellcheck
        run: |
          if command -v brew >/dev/null; then brew install shellcheck; else sudo apt-get install -y shellcheck; fi
      - run: make validate
